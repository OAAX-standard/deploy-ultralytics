name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # PythonBindings is a private repository in this organization, and it
      # references its own submodule over SSH; rewrite both to token-authenticated HTTPS.
      - name: Authenticate to private repositories
        env:
          PYTHONBINDINGS_TOKEN: ${{ secrets.PYTHONBINDINGS_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${PYTHONBINDINGS_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${PYTHONBINDINGS_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Install the package
        run: uv sync --locked

      # No OAAX 2.0 runtime is published yet: build the CPU runtime from the oaax-v2 branch of
      # the reference implementation. fetch replaces this once release artifacts exist.
      - uses: actions/checkout@v4
        with:
          repository: OAAX-standard/reference-implementation
          ref: oaax-v2
          path: reference-implementation
          submodules: recursive
          lfs: true

      - name: Build the CPU runtime
        working-directory: reference-implementation
        run: |
          sudo bash scripts/setup-env.sh
          bash runtime-library/build-runtimes.sh X86_64
          echo "DEPLOY_ULTRALYTICS_RUNTIME=$PWD/runtime-library/artifacts/X86_64/libRuntimeLibrary.so" >> "$GITHUB_ENV"

      - name: Run the test suite
        run: uv run pytest
