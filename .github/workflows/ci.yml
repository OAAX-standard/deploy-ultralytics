name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      # PythonBindings is a private repository in this organization, and it
      # references its own submodule over SSH; rewrite both to token-authenticated HTTPS.
      - name: Authenticate to private repositories
        env:
          PYTHONBINDINGS_TOKEN: ${{ secrets.PYTHONBINDINGS_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${PYTHONBINDINGS_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${PYTHONBINDINGS_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Install the package
        run: uv sync --locked --extra test

      # The README's walkthrough is the proof that the documented commands work: run them as written.
      # Its fetch also provides the runtime and the toolchain image the test suite needs.
      - name: Run the README walkthrough
        run: |
          sed -n '/^## Walkthrough/,/^## Export/p' README.md \
            | grep '^\(deploy-ultralytics \(fetch\|export\|convert\|detect\) \|export DEPLOY_ULTRALYTICS_RUNTIME=\)' > walkthrough.sh
          test "$(wc -l < walkthrough.sh)" -eq 5
          uv run bash -e -x walkthrough.sh
          test -s test-image.detections.json
          test -s test-image.annotated.jpg
          echo "DEPLOY_ULTRALYTICS_RUNTIME=$PWD/runtimes/cpu/libRuntimeLibrary.so" >> "$GITHUB_ENV"

      # The detect and convert tests skip when the runtime or toolchain is missing; in CI that
      # would hide a broken fetch, so any skipped test fails the job.
      - name: Run the test suite
        run: |
          uv run pytest -rs | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::tests were skipped; CI must run every test"
            exit 1
          fi
