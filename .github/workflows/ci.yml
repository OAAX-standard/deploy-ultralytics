name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The runtime build, its cross-compilers and the toolchain image outgrow the runner's free
      # disk; drop preinstalled SDKs this job never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # PythonBindings is a private repository in this organization, and it
      # references its own submodule over SSH; rewrite both to token-authenticated HTTPS.
      - name: Authenticate to private repositories
        env:
          PYTHONBINDINGS_TOKEN: ${{ secrets.PYTHONBINDINGS_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${PYTHONBINDINGS_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${PYTHONBINDINGS_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Install the package
        run: uv sync --locked

      # No OAAX 2.0 runtime or toolchain is published yet: build both from the oaax-v2 branch of
      # the reference implementation. fetch replaces this once release artifacts exist.
      - uses: actions/checkout@v4
        with:
          repository: OAAX-standard/reference-implementation
          ref: oaax-v2
          path: reference-implementation
          submodules: recursive
          lfs: true

      - name: Build the CPU runtime
        working-directory: reference-implementation
        run: |
          sudo bash scripts/setup-env.sh
          bash runtime-library/build-runtimes.sh X86_64
          echo "DEPLOY_ULTRALYTICS_RUNTIME=$PWD/runtime-library/artifacts/X86_64/libRuntimeLibrary.so" >> "$GITHUB_ENV"

      - name: Build the CPU toolchain image
        working-directory: reference-implementation
        run: bash conversion-toolchain/build-toolchain.sh

      # The detect and convert tests skip when the runtime or toolchain is missing; in CI that
      # would hide a broken build, so any skipped test fails the job.
      - name: Run the test suite
        run: |
          uv run pytest -rs | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then
            echo "::error::tests were skipped; CI must run every test"
            exit 1
          fi

      # The README's walkthrough is the proof that the documented commands work: run them as written.
      - name: Run the README walkthrough
        run: |
          sed -n '/^## Walkthrough/,/^## Export/p' README.md \
            | grep '^deploy-ultralytics \(export\|convert\|detect\) ' > walkthrough.sh
          test "$(wc -l < walkthrough.sh)" -eq 3
          uv run bash -e -x walkthrough.sh
          test -s test-image.detections.json
          test -s test-image.annotated.jpg
