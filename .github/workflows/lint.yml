name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    name: pre-commit (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: pre-commit/action@v3.0.1
