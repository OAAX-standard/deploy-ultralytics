[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-ultralytics"
version = "0.1.0"
description = "Run Ultralytics YOLO models on several accelerators through OAAX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy",
    "oaax @ git+https://github.com/OAAX-standard/PythonBindings.git@6cbdbb5435c61f86655ce31d12fa0432c23d32f9",
    "onnx>=1.23.1",
    "onnxslim>=0.1.97",
    "opencv-python",
    "torch",
    "torchvision",
    "ultralytics>=8.4.123",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
deploy-ultralytics = "deploy_ultralytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deploy_ultralytics = ["targets/*/*"]

# Nothing here runs torch on a GPU: export runs on CPU and inference goes through OAAX runtimes.
# The CPU build spares every install the CUDA wheels, several GB. uv applies sources only to
# direct dependencies, so torch and torchvision are listed above although ultralytics pulls them.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
